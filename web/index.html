<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="minigames_engine">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>minigames_engine</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Loader HTML/CSS puro: se pinta apenas el navegador parsea el body, antes
    de que corra cualquier JS. Cubre el hueco en blanco mientras se descarga
    el engine de Flutter. Se retira desde flutter_bootstrap.js cuando el
    engine dispara "flutter-first-frame" (ver ese archivo).

    CRÍTICO: este <style> y el markup de #app-loader de más abajo tienen que
    quedarse chicos a propósito — son lo único que el navegador tiene que
    descargar y parsear antes de pintar el primer píxel. La versión "rica"
    (anillo, satélites, tip rotando) se inyecta por JS unos milisegundos
    después, desde el script al final del body, para no bloquear ese
    primer pintado con varios KB de CSS. Ver README, sección "Pantalla de
    carga".
  -->
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #FAF8FF;
      z-index: 9999;
      transition: opacity 300ms ease-out;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app-loader.app-loader--hidden {
      opacity: 0;
      pointer-events: none;
    }

    #app-loader__mark {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #006C49;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app-loader__spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 4px solid #6FFBBE;
      border-top-color: #10B981;
      animation: app-loader-spin 0.8s linear infinite;
    }

    #app-loader__text {
      font-size: 14px;
      font-weight: 600;
      color: #131B2E;
    }

    @keyframes app-loader-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-loader" role="status" aria-live="polite">
    <div id="app-loader__mark">
      <div id="app-loader__spinner"></div>
    </div>
    <span id="app-loader__text">Cargando…</span>
  </div>

  <!--
    Primero: inyecta el CSS/markup "rico" (badge, anillo, satélites, tip)
    por JS, sin que esos KB extra bloqueen el primer pintado de arriba.
    Segundo: rota ahí las explicaciones de assets/data/trivia.json (las
    mismas que la app ya muestra tras cada ronda como "¿Sabías que…?").
    Todo JS plano, independiente de Flutter: tiene que poder funcionar antes
    de que el engine exista. Si algo falla, se queda el loader simple de
    arriba — nunca se rompe a un estado peor.
  -->
  <script>
    (function () {
      var richStyle = document.createElement('style');
      richStyle.textContent = [
        '#app-loader__mark, #app-loader__spinner, #app-loader__text { display: none; }',
        '.app-loader__card { width: 100%; max-width: 340px; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }',
        '.app-loader__badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 9999px; background: #EAEDFF; color: #131B2E; font-size: 12px; font-weight: 600; }',
        '.app-loader__badge-dot { width: 8px; height: 8px; border-radius: 50%; background: #10B981; }',
        '.app-loader__orbit { position: relative; width: 176px; height: 176px; }',
        '.app-loader__halo { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(111, 251, 190, 0.45), rgba(111, 251, 190, 0)); }',
        '.app-loader__ring { position: absolute; top: 12px; left: 12px; width: 152px; height: 152px; border-radius: 50%; background: conic-gradient(#10B981 0deg 115deg, transparent 115deg 130deg, #FEA619 130deg 202deg, transparent 202deg 216deg, #41AFD1 216deg 295deg, transparent 295deg 310deg, #DAE2FD 310deg 346deg, transparent 346deg 360deg); animation: app-loader-spin 3s linear infinite; }',
        '.app-loader__hole { position: absolute; top: 21px; left: 21px; width: 134px; height: 134px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }',
        '.app-loader__center { position: absolute; top: 38px; left: 38px; width: 100px; height: 100px; border-radius: 50%; background: #006C49; display: flex; align-items: center; justify-content: center; }',
        '.app-loader__satellite { position: absolute; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }',
        '.app-loader__satellite--top { top: 14px; right: 8px; background: #FFDDB8; color: #855300; }',
        '.app-loader__satellite--bottom { bottom: 30px; left: 6px; background: #B7EAFF; color: #006780; }',
        '.app-loader__brand { font-size: 24px; font-weight: 800; color: #131B2E; }',
        '.app-loader__brand-accent { color: #10B981; }',
        '.app-loader__tagline { font-size: 13px; font-weight: 600; color: #3C4A42; margin-top: -12px; }',
        '.app-loader__tip { display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 16px; background: #F2F3FF; text-align: left; }',
        '.app-loader__tip-icon { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; background: #B7EAFF; color: #006780; display: flex; align-items: center; justify-content: center; }',
        '.app-loader__tip-label { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #006780; }',
        '#app-loader__tip-text { display: block; margin-top: 4px; font-size: 13px; color: #131B2E; transition: opacity 200ms ease-in-out; }',
        '#app-loader__tip-text.app-loader__tip-text--fade { opacity: 0; }'
      ].join('\n');
      document.head.appendChild(richStyle);

      var loader = document.getElementById('app-loader');
      loader.innerHTML =
        '<div class="app-loader__card">' +
          '<div class="app-loader__badge"><span class="app-loader__badge-dot"></span>Modo arcade • Aprender jugando</div>' +
          '<div class="app-loader__orbit">' +
            '<div class="app-loader__halo"></div>' +
            '<div class="app-loader__ring"></div>' +
            '<div class="app-loader__hole"></div>' +
            '<div class="app-loader__center">' +
              '<svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="#FFFFFF" stroke-width="1.6">' +
                '<circle cx="12" cy="12" r="9" /><ellipse cx="12" cy="12" rx="4" ry="9" /><line x1="3" y1="12" x2="21" y2="12" />' +
              '</svg>' +
            '</div>' +
            '<div class="app-loader__satellite app-loader__satellite--top">' +
              '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17 1.19.3 2.34.3C17 20 22 7 22 2c-5.5 0-9.5 2-12 5.5" /></svg>' +
            '</div>' +
            '<div class="app-loader__satellite app-loader__satellite--bottom">' +
              '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M11 21h-1l1-7H7l6-11h1l-1 7h4z" /></svg>' +
            '</div>' +
          '</div>' +
          '<div>' +
            '<div class="app-loader__brand">Eco<span class="app-loader__brand-accent">Trivia</span></div>' +
            '<div class="app-loader__tagline">Desafío de Conciencia Planetaria</div>' +
          '</div>' +
          '<div class="app-loader__tip">' +
            '<div class="app-loader__tip-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M9 21h6v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z" /></svg></div>' +
            '<div>' +
              '<div class="app-loader__tip-label">¿SABÍAS QUE…?</div>' +
              '<span id="app-loader__tip-text">Preparando tu desafío verde…</span>' +
            '</div>' +
          '</div>' +
        '</div>';

      var textEl = document.getElementById('app-loader__tip-text');
      var tips = [];
      var index = 0;
      var intervalId = null;

      function renderTip() {
        textEl.classList.add('app-loader__tip-text--fade');
        window.setTimeout(function () {
          textEl.textContent = tips[index];
          textEl.classList.remove('app-loader__tip-text--fade');
        }, 200);
      }

      function startRotation() {
        if (tips.length === 0 || intervalId !== null) return;
        renderTip();
        intervalId = window.setInterval(function () {
          index = (index + 1) % tips.length;
          renderTip();
        }, 3800);
      }

      function stopRotation() {
        if (intervalId !== null) {
          window.clearInterval(intervalId);
          intervalId = null;
        }
      }

      fetch('assets/assets/data/trivia.json')
        .then(function (response) { return response.json(); })
        .then(function (data) {
          var seen = {};
          (data.questions || []).forEach(function (question) {
            var explanation = question && question.explanation;
            if (explanation && !seen[explanation]) {
              seen[explanation] = true;
              tips.push(explanation);
            }
          });
          for (var i = tips.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = tips[i];
            tips[i] = tips[j];
            tips[j] = tmp;
          }
          startRotation();
        })
        .catch(function () {
          // Sin conexión a assets/data/trivia.json: se queda el texto fijo.
        });

      window.addEventListener('flutter-first-frame', stopRotation, { once: true });
    })();
  </script>

  <!--
    flutter_bootstrap.js está sobreescrito en este proyecto (ver ese archivo
    en este mismo directorio) para quitar #app-loader recién cuando el
    engine pinta su primer frame.

    Más detalles:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
