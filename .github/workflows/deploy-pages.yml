# Compila la versión web y la publica en GitHub Pages en cada push a main.
# URL: https://maximilianovallejo1991.github.io/minigames-engine/
#
# Requisito (una sola vez): Settings → Pages → Source: "GitHub Actions".
name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes seguidos, se publica solo el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # El sitio vive en /minigames-engine/, por eso el base-href.
      - run: flutter build web --release --base-href /minigames-engine/

      # Si alguien entra a una ruta directa, GitHub Pages sirve 404.html:
      # que sea la misma app evita la página de error.
      - run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
